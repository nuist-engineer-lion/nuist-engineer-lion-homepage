name: Validate Notices

on:
  pull_request:
    paths:
      - "notices/entries/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate notice entries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changed notice files
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          # -z 让 diff 输出以 NUL 分隔，mapfile 原样读入数组并逐个加引号传参，
          # 避免单词拆分与通配符展开改动待校验文件列表（如名为 *.md 的字面文件）
          mapfile -d '' -t CHANGED < <(git diff --name-only --diff-filter=ACMR -z "$BASE" HEAD -- notices/entries/)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "没有新增或修改的通知文件（仅删除或无改动），跳过校验。"
            exit 0
          fi
          echo "待校验文件："
          printf '%s\n' "${CHANGED[@]}"
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - "${CHANGED[@]}" <<'PYEOF'
          import re
          import sys
          from datetime import date, datetime
          from pathlib import Path

          import yaml

          NAME_RE = re.compile(r"^\d{4}-\d{2}-\d{2}-[A-Za-z0-9-]+\.md$")
          FM_RE = re.compile(r"\A---\s*\n(.*?)\n---\s*\n", re.S)


          def frontmatter_problems(fm_text: str, filename: str) -> list[str]:
              problems = []
              try:
                  fm = yaml.safe_load(fm_text)
              except (yaml.YAMLError, ValueError) as e:
                  return [f"frontmatter 解析失败: {e}"]
              if not isinstance(fm, dict):
                  return ["frontmatter 需为 YAML 映射"]

              title = fm.get("title")
              if not isinstance(title, str) or not title.strip():
                  problems.append("frontmatter 缺少必填的 title（不能为空、null 或注释）")

              d = fm.get("date")
              date_str = None
              if isinstance(d, datetime):
                  problems.append("date 需为 YYYY-MM-DD 日期，不要带时间部分")
              elif isinstance(d, date):
                  # PyYAML 已把合法的 YYYY-MM-DD 解析为 date 对象，日历有效性由此保证
                  date_str = d.isoformat()
              elif isinstance(d, str):
                  # 引号包裹的日期：用严格的日历日期解析器验证
                  try:
                      date_str = date.fromisoformat(d.strip()).isoformat()
                  except ValueError:
                      pass
              if not isinstance(d, datetime):
                  if date_str is None:
                      problems.append("frontmatter 缺少必填的 date（需为有效的 YYYY-MM-DD 日历日期）")
                  elif filename[:10] != date_str:
                      problems.append(f"文件名日期 {filename[:10]} 与 frontmatter date {date_str} 不一致")
              return problems


          failures = []
          for arg in sys.argv[1:]:
              p = Path(arg)
              problems = []
              if not p.exists():
                  failures.append(f"{p}: 文件不存在")
                  continue
              text = p.read_text(encoding="utf-8")
              if not NAME_RE.match(p.name):
                  problems.append("文件名需为 YYYY-MM-DD-slug.md（slug 用拼音或英文）")
              m = FM_RE.match(text)
              if not m:
                  problems.append("缺少 frontmatter（文件需以 --- 包裹的 YAML 开头）")
              else:
                  problems.extend(frontmatter_problems(m.group(1), p.name))
              if problems:
                  failures.append(f"{p}:\n" + "\n".join(f"  - {x}" for x in problems))

          if failures:
              for f in failures:
                  print(f)
              print(f"::error::通知文件校验未通过：{len(failures)} 个文件有问题")
              sys.exit(1)
          print(f"通知文件校验通过：{len(sys.argv) - 1} 个文件")
          PYEOF
